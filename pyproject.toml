[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-planta"
version = "0.1.0"
description = "Sistema de la planta de inyección: parte por voz, detección y alertas (TP Academia Novit 2026)"
requires-python = ">=3.11"
dependencies = [
    # El contrato se instala con pip desde el repo público de la planta, fijado al commit con el que se probó.
    # El link de docs/contrato.md (academia2026-planta) da 404: el repo público es academia2026-tp.
    "planta-contrato @ git+https://github.com/NovitSoftware/academia2026-tp@ab65b95e911731351dba395817a74a8cc60da2b2#subdirectory=contrato",
    "paho-mqtt>=2.1,<3",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    # Transcripción local en CPU (Whisper sobre CTranslate2). Provisorio hasta tener la lista cerrada del curso.
    "faster-whisper>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
